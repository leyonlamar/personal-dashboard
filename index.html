<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Dashboard</title>
<style>
  :root {
    --text-primary: #FAFAFA;
    --text-secondary: #B8B6B0;
    --text-tertiary: #76746E;
    --success: #6BE3A4;
    --warning: #F2C063;
    --danger: #FF6B6B;
    --card-bg: rgba(255, 255, 255, 0.04);
    --hairline: rgba(255, 255, 255, 0.06);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: #050506;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    max-width: 1100px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 28px) 22px 60px;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: -10%;
    pointer-events: none;
    z-index: -2;
    background:
      radial-gradient(circle at 82% 14%, rgba(224, 118, 88, 0.16), transparent 55%),
      radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 55%);
    filter: blur(40px);
    animation: bg-drift 36s ease-in-out infinite alternate;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: 1;
  }

  @keyframes bg-drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(2%, -1.5%) scale(1.04); }
  }

  /* ---------- Page Title ---------- */
  .dash-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin: 0 0 14px;
    background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  /* ---------- Goal Ticker ---------- */
  .ticker-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 18px;
  }
  .goal-ticker {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    border-radius: 12px;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.30) 100%);
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.30) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative;
    overflow: hidden;
  }
  .goal-ticker::after {
    content: '';
    position: absolute;
    top: 0;
    left: -40%;
    width: 30%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    animation: ticker-sweep 8s linear infinite;
    pointer-events: none;
  }
  @keyframes ticker-sweep {
    0%   { left: -40%; }
    100% { left: 110%; }
  }
  .goal-ticker-led {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .goal-ticker-led-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #6BE3A4;
    box-shadow: 0 0 8px rgba(107,227,164,0.7);
    animation: led-pulse 1.6s ease-in-out infinite;
  }
  @keyframes led-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.85); }
  }
  .goal-ticker-label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: var(--text-tertiary);
  }
  .goal-ticker-stage {
    flex: 1;
    height: 22px;
    position: relative;
    overflow: hidden;
  }
  .goal-ticker-row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 22px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    white-space: nowrap;
    position: absolute;
    left: 0; right: 0; top: 0;
  }
  .goal-ticker-status {
    width: 18px;
    flex: 0 0 18px;
    text-align: center;
  }
  .goal-ticker-status[data-status="done"]    { color: #6BE3A4; }
  .goal-ticker-status[data-status="pending"] { color: var(--text-tertiary); }
  .goal-ticker-status[data-status="empty"]   { color: var(--text-tertiary); }
  .goal-ticker-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .goal-ticker-meta {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
  }
  .goal-ticker-row.is-leaving  { animation: ticker-leave 0.45s cubic-bezier(0.55, 0, 0.55, 1) forwards; }
  .goal-ticker-row.is-entering { animation: ticker-enter 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes ticker-leave {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-100%); }
  }
  @keyframes ticker-enter {
    0%   { opacity: 0; transform: translateY(100%); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Day Ring ---------- */
  .day-ring-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 26px;
    margin-bottom: 24px;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 22px;
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  .day-ring-vis {
    width: 168px;
    height: 168px;
    position: relative;
    flex-shrink: 0;
  }
  .day-ring-vis svg { width: 100%; height: 100%; display: block; }
  .day-ring-track {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 8;
  }
  .day-ring-fill {
    fill: none;
    stroke: #FFD89E;
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                stroke-dashoffset 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    filter: url(#dayRingGlow);
  }
  .day-ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .day-ring-percent {
    font-size: 40px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--text-primary);
  }
  .day-ring-phase {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--text-tertiary);
    margin-top: 5px;
  }
  .day-ring-clock {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px;
    color: var(--text-tertiary);
    margin-top: 3px;
  }
  .day-ring-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 280px;
  }
  .day-ring-status {
    font-size: 14px;
    color: var(--text-primary);
    font-weight: 700;
  }
  .day-ring-remaining {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .day-ring-range {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--text-tertiary);
  }

  /* ---------- Section header ---------- */
  .section { margin-top: 8px; }
  .section-title {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 12px;
  }
  .section-title::before {
    content: '';
    width: 18px;
    height: 1px;
    background: var(--text-tertiary);
    opacity: 0.6;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
  }

  /* ---------- Cards ---------- */
  .gm-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    margin-bottom: 16px;
    position: relative;
    transition: background 0.4s ease;
  }
  .gm-all-done {
    background:
      radial-gradient(circle at 50% 0%, rgba(107,227,164,0.10), transparent 60%),
      var(--card-bg);
  }
  .gm-all-done .gm-progress-num,
  .gm-all-done .gm-progress-label { color: var(--success); }

  .gm-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
  }
  .gm-header-left { display: flex; flex-direction: column; }
  .gm-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }
  .gm-progress-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .gm-progress-num {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--text-primary);
  }
  .gm-progress-total {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 18px;
    color: var(--text-tertiary);
  }
  .gm-progress-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-left: 4px;
  }

  .gm-streak {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid transparent;
    color: var(--text-tertiary);
    transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }
  .gm-streak-bolt { font-size: 13px; line-height: 1; transition: filter 0.3s ease; }
  .gm-streak-num {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 13px;
  }
  .gm-streak-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    font-weight: 600;
  }
  .gm-streak-active {
    background: rgba(242,192,99,0.10);
    color: #F2C063;
    border-color: rgba(242,192,99,0.32);
  }
  .gm-streak-active .gm-streak-bolt {
    filter: drop-shadow(0 0 6px rgba(242,192,99,0.6));
  }

  /* ---------- Segmented bar ---------- */
  .gm-bar {
    display: flex;
    gap: 4px;
    height: 6px;
    margin-bottom: 16px;
  }
  .gm-bar:empty { display: none; }
  .gm-bar-seg {
    flex: 1;
    height: 100%;
    border-radius: 3px;
    background: rgba(255,255,255,0.06);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .gm-bar-seg-done {
    background: #6BE3A4;
    box-shadow: 0 0 6px rgba(107,227,164,0.40);
  }

  /* ---------- Goal list ---------- */
  .goal-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .empty-state {
    font-size: 12px;
    color: var(--text-tertiary);
    font-style: italic;
    padding: 14px 0;
    text-align: center;
  }
  .goal-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.035);
    border-radius: 12px;
    border: 1px solid var(--hairline);
    transition: background 0.2s ease, opacity 0.3s ease, transform 0.2s ease;
    position: relative;
  }
  .goal-item:hover {
    background: rgba(255,255,255,0.06);
  }
  .goal-item.is-dragover {
    border-top: 2px solid #FAFAFA;
  }
  .goal-drag {
    width: 14px;
    color: var(--text-tertiary);
    cursor: grab;
    letter-spacing: -2px;
    opacity: 0;
    transition: opacity 0.2s ease;
    user-select: none;
    font-size: 14px;
    flex-shrink: 0;
  }
  .goal-item:hover .goal-drag { opacity: 1; }
  .goal-drag:active { cursor: grabbing; }

  .goal-checkbox {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 1.5px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.30);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    margin: 0;
    transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .goal-checkbox:checked {
    background: #6BE3A4;
    border-color: #6BE3A4;
    box-shadow: 0 0 12px rgba(107,227,164,0.40);
  }
  .goal-checkbox:checked::after {
    content: '';
    position: absolute;
    left: 6px;
    top: 2px;
    width: 6px;
    height: 11px;
    border: solid #0A0A0B;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(1);
    animation: check-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .goal-checkbox:disabled { cursor: not-allowed; opacity: 0.6; }
  @keyframes check-pop {
    0%   { transform: rotate(45deg) scale(0); }
    100% { transform: rotate(45deg) scale(1); }
  }

  .goal-text {
    flex: 1;
    font-size: 14px;
    color: var(--text-primary);
    cursor: text;
    outline: none;
    word-break: break-word;
    line-height: 1.4;
  }
  .goal-text[contenteditable="true"] {
    outline: 1px solid rgba(255,255,255,0.20);
    border-radius: 4px;
    padding: 2px 4px;
    margin: -2px -4px;
  }

  .gm-queue-btn {
    background: none;
    border: none;
    color: var(--text-tertiary);
    opacity: 0.55;
    cursor: pointer;
    font-size: 14px;
    padding: 4px 6px;
    border-radius: 6px;
    transition: color 0.2s ease, opacity 0.2s ease, filter 0.2s ease;
    flex-shrink: 0;
  }
  .gm-queue-btn:hover { opacity: 1; }
  .gm-queue-btn.is-active {
    color: #F2C063;
    opacity: 1;
    filter: drop-shadow(0 0 4px rgba(242,192,99,0.65));
  }
  .gm-queue-btn:disabled { cursor: not-allowed; opacity: 0.3; }
  .goal-item.is-queue-flashing {
    animation: gm-queue-flash 0.48s ease-out;
  }
  @keyframes gm-queue-flash {
    0%   { background: rgba(255,255,255,0.035); transform: scale(1); }
    50%  { background: rgba(242,192,99,0.32); transform: scale(1.015); }
    100% { background: rgba(255,255,255,0.035); transform: scale(1); }
  }

  .goal-delete {
    background: none;
    border: none;
    color: var(--text-tertiary);
    opacity: 0.5;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    border-radius: 6px;
    transition: color 0.2s ease, opacity 0.2s ease;
    flex-shrink: 0;
    line-height: 1;
  }
  .goal-item:hover .goal-delete { opacity: 1; }
  .goal-delete:hover { color: var(--danger); }

  .goal-item.is-done {
    opacity: 0.45;
    background: rgba(107,227,164,0.04);
  }
  .goal-item.is-done .goal-text {
    text-decoration: line-through;
    text-decoration-color: rgba(255,255,255,0.4);
  }
  .goal-item.is-queued {
    background: rgba(242,192,99,0.10);
    box-shadow: inset 3px 0 0 0 #F2C063;
  }
  .goal-item.is-queued .goal-text {
    color: #FFE2A8;
  }

  .gm-show-more {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: 1px dashed rgba(255,255,255,0.12);
    color: var(--text-tertiary);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    margin: 4px 0 6px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .gm-show-more:hover {
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.24);
  }

  .gm-push-btn {
    display: block;
    width: 100%;
    background: none;
    border: 1px dashed rgba(255,255,255,0.14);
    color: var(--text-tertiary);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    margin: 8px 0 4px;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .gm-push-btn:hover {
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.32);
    background: rgba(255,255,255,0.03);
  }

  /* ---------- Quick add ---------- */
  .gm-input-wrap {
    display: flex;
    gap: 8px;
    align-items: center;
    border-top: 1px solid var(--hairline);
    padding-top: 14px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .goal-input {
    flex: 1;
    min-width: 160px;
    padding: 11px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--hairline);
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .goal-input::placeholder { color: var(--text-tertiary); }
  .goal-input:focus {
    border-color: rgba(255,255,255,0.32);
    background: rgba(255,255,255,0.06);
  }

  .goal-add-btn {
    padding: 11px 20px;
    border-radius: 12px;
    background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
    color: #0A0A0B;
    font-weight: 700;
    font-size: 13px;
    border: none;
    cursor: pointer;
    box-shadow:
      0 4px 14px rgba(0,0,0,0.30),
      0 1px 0 rgba(0,0,0,0.20),
      inset 0 1px 0 rgba(255,255,255,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .goal-add-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.06);
    box-shadow:
      0 6px 18px rgba(0,0,0,0.35),
      0 1px 0 rgba(0,0,0,0.20),
      inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .goal-polish-btn {
    padding: 11px 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    color: var(--text-primary);
    font-weight: 700;
    font-size: 13px;
    border: 1px solid rgba(255,255,255,0.10);
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .goal-polish-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.20);
  }

  .polish-status {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 6px;
    min-height: 14px;
  }
  .polish-status.is-error { color: var(--danger); }

  /* ---------- Tomorrow card specifics ---------- */
  .gm-card-tomorrow .gm-progress-row { display: none; }
  .gm-tomorrow-sub {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 2px;
  }
  .gm-tomorrow-count {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    color: var(--text-tertiary);
    letter-spacing: 0.08em;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 480px) {
    .dash-title { font-size: 22px; }
    .goal-ticker { padding: 9px 12px; }
    .goal-ticker-label { font-size: 9px; letter-spacing: 0.14em; }
    .goal-ticker-row { font-size: 12px; }
    .goal-ticker-meta { font-size: 10px; padding: 2px 7px; }
    .day-ring-vis { width: 144px; height: 144px; }
    .day-ring-percent { font-size: 32px; }
    .day-ring-status { font-size: 13px; }
  }
</style>
</head>
<body>

<h1 class="dash-title">My Dashboard</h1>

<!-- Goal Ticker -->
<div class="ticker-row">
  <div class="goal-ticker" id="goalTicker" aria-live="polite" aria-atomic="true">
    <div class="goal-ticker-led"><span class="goal-ticker-led-dot"></span></div>
    <div class="goal-ticker-label">GOALS</div>
    <div class="goal-ticker-stage" id="goalTickerStage">
      <div class="goal-ticker-row">
        <span class="goal-ticker-status" data-status="">—</span>
        <span class="goal-ticker-text">Loading…</span>
      </div>
    </div>
    <div class="goal-ticker-meta" id="goalTickerMeta">0/0</div>
  </div>
</div>

<!-- Day Ring -->
<div class="day-ring-wrap">
  <div class="day-ring-vis">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <filter id="dayRingGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <circle class="day-ring-track" cx="60" cy="60" r="52"></circle>
      <circle class="day-ring-fill" id="dayRingFill"
              cx="60" cy="60" r="52"
              transform="rotate(-90 60 60)"></circle>
    </svg>
    <div class="day-ring-text">
      <div class="day-ring-percent" id="dayRingPercent">0%</div>
      <div class="day-ring-phase" id="dayRingPhase">MORNING</div>
      <div class="day-ring-clock" id="dayRingClock">—</div>
    </div>
  </div>
  <div class="day-ring-info">
    <div class="day-ring-status" id="dayRingStatus">—</div>
    <div class="day-ring-remaining" id="dayRingRemaining">—</div>
    <div class="day-ring-range">8:00 AM – 12:00 AM</div>
  </div>
</div>

<!-- To Do List -->
<div class="section">
  <div class="section-title">To Do List</div>

  <!-- TODAY -->
  <div class="gm-card" id="gmCardToday">
    <div class="gm-header">
      <div class="gm-header-left">
        <div class="gm-eyebrow" id="todayLabel">Today</div>
        <div class="gm-progress-row">
          <span class="gm-progress-num" id="gmProgressNum">0</span>
          <span class="gm-progress-total" id="gmProgressTotal">/ 0</span>
          <span class="gm-progress-label" id="gmProgressLabel">no goals yet</span>
        </div>
      </div>
      <div class="gm-streak" id="gmStreak">
        <span class="gm-streak-bolt">⚡</span>
        <span class="gm-streak-num" id="gmStreakNum">0</span>
        <span class="gm-streak-label">day streak</span>
      </div>
    </div>
    <div class="gm-bar" id="gmBar"></div>
    <ul id="goalList" class="goal-list gm-list"></ul>
    <div id="emptyState" class="empty-state">No goals for today yet — add one below.</div>
    <button id="gmPushBtn" class="gm-push-btn" style="display:none;">Push remaining to tomorrow ↪</button>
    <div class="gm-input-wrap goal-input-wrap">
      <input type="text" id="goalInput" class="goal-input" placeholder="Add a goal for today…" />
      <button id="goalAddBtn" class="goal-add-btn">+ Add</button>
      <button id="goalPolishBtn" class="goal-polish-btn">✨ Polish</button>
    </div>
    <div id="polishStatus" class="polish-status"></div>
  </div>

  <!-- TOMORROW -->
  <div class="gm-card gm-card-tomorrow" id="gmCardTomorrow">
    <div class="gm-header">
      <div class="gm-header-left">
        <div class="gm-eyebrow" id="tomorrowLabel">Plan tomorrow</div>
        <div class="gm-tomorrow-sub">Write tonight, locked until 6 AM.</div>
      </div>
      <div class="gm-tomorrow-count" id="gmTomorrowCount">0 planned</div>
    </div>
    <ul id="tomorrowList" class="goal-list gm-list"></ul>
    <div id="tomorrowEmpty" class="empty-state">Nothing planned for tomorrow yet</div>
    <div class="gm-input-wrap goal-input-wrap">
      <input type="text" id="tomorrowInput" class="goal-input" placeholder="Add a goal for tomorrow…" />
      <button id="tomorrowAddBtn" class="goal-add-btn">+ Add</button>
      <button id="tomorrowPolishBtn" class="goal-polish-btn">✨ Polish</button>
    </div>
    <div id="tomorrowStatus" class="polish-status"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const ANTHROPIC_API_KEY = '';

  // ----------- Storage helpers -----------
  function storeGet(key) {
    try {
      const v = localStorage.getItem(key);
      return v == null ? null : JSON.parse(v);
    } catch (e) { return null; }
  }
  function storeSet(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
    if (typeof key === 'string' && key.startsWith('goals:')) {
      window.dispatchEvent(new CustomEvent('goals-changed'));
    }
  }
  function storeDelete(key) { localStorage.removeItem(key); }
  function storeListKeys(prefix) {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) out.push(k);
    }
    return out;
  }

  // ----------- Date helpers -----------
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function dateToYMD(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function getActiveDateString() {
    const now = new Date();
    if (now.getHours() < 6) {
      const d = new Date(now);
      d.setDate(d.getDate() - 1);
      return dateToYMD(d);
    }
    return dateToYMD(now);
  }
  function getTomorrowDateString() {
    const now = new Date();
    if (now.getHours() < 6) {
      return dateToYMD(now);
    }
    const d = new Date(now);
    d.setDate(d.getDate() + 1);
    return dateToYMD(d);
  }
  const WEEKDAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatDate(ymd) {
    const parts = ymd.split('-').map(Number);
    const d = new Date(parts[0], parts[1]-1, parts[2]);
    return WEEKDAY_SHORT[d.getDay()] + ', ' + MONTH_SHORT[d.getMonth()] + ' ' + d.getDate();
  }

  // ----------- Rollover -----------
  function rolloverIncomplete() {
    const activeDate = getActiveDateString();
    const todayKey = 'goals:' + activeDate;
    const today = storeGet(todayKey) || [];
    const existingTexts = new Set(today.map(g => g.text));

    const keys = storeListKeys('goals:');
    for (const k of keys) {
      const dayPart = k.slice('goals:'.length);
      if (dayPart >= activeDate) continue;
      const arr = storeGet(k) || [];
      for (const g of arr) {
        if (!g.done && !existingTexts.has(g.text)) {
          today.push({ text: g.text, done: false });
          existingTexts.add(g.text);
        }
      }
      storeDelete(k);
    }
    if (today.length > 0) {
      localStorage.setItem(todayKey, JSON.stringify(today));
    }
  }

  // ----------- Streak -----------
  const STREAK_KEY = 'goal_streak_v1';
  function checkStreak() {
    const activeDate = getActiveDateString();
    const state = storeGet(STREAK_KEY) || { count: 0, lastProcessedDate: null };
    const keys = storeListKeys('goals:')
      .map(k => k.slice('goals:'.length))
      .filter(d => d < activeDate)
      .sort();

    let count = state.count;
    let last = state.lastProcessedDate;
    for (const d of keys) {
      if (last && d <= last) continue;
      const arr = storeGet('goals:' + d) || [];
      if (arr.length === 0) {
        last = d;
        continue;
      }
      const allDone = arr.every(g => g.done);
      count = allDone ? count + 1 : 0;
      last = d;
    }
    storeSet(STREAK_KEY, { count, lastProcessedDate: last });
    return { count };
  }

  // ----------- DOM refs -----------
  const $ = (id) => document.getElementById(id);
  const todayLabel = $('todayLabel');
  const tomorrowLabel = $('tomorrowLabel');
  const gmProgressNum = $('gmProgressNum');
  const gmProgressTotal = $('gmProgressTotal');
  const gmProgressLabel = $('gmProgressLabel');
  const gmStreak = $('gmStreak');
  const gmStreakNum = $('gmStreakNum');
  const gmBar = $('gmBar');
  const goalList = $('goalList');
  const emptyState = $('emptyState');
  const goalInput = $('goalInput');
  const goalAddBtn = $('goalAddBtn');
  const goalPolishBtn = $('goalPolishBtn');
  const polishStatus = $('polishStatus');
  const gmPushBtn = $('gmPushBtn');
  const gmCardToday = $('gmCardToday');

  const tomorrowList = $('tomorrowList');
  const tomorrowEmpty = $('tomorrowEmpty');
  const tomorrowInput = $('tomorrowInput');
  const tomorrowAddBtn = $('tomorrowAddBtn');
  const tomorrowPolishBtn = $('tomorrowPolishBtn');
  const tomorrowStatus = $('tomorrowStatus');
  const gmTomorrowCount = $('gmTomorrowCount');

  // ----------- Inline edit -----------
  function makeInlineEdit(textEl, getGoals, idx, key, reload) {
    textEl.addEventListener('click', () => {
      if (textEl.getAttribute('contenteditable') === 'true') return;
      textEl.setAttribute('contenteditable', 'true');
      textEl.focus();
      const range = document.createRange();
      range.selectNodeContents(textEl);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
    let cancelled = false;
    textEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); textEl.blur(); }
      else if (e.key === 'Escape') { cancelled = true; textEl.blur(); }
    });
    textEl.addEventListener('blur', () => {
      textEl.removeAttribute('contenteditable');
      const newText = textEl.textContent.trim();
      const goals = getGoals();
      if (cancelled) {
        cancelled = false;
        textEl.textContent = goals[idx] ? goals[idx].text : '';
        return;
      }
      if (!newText) {
        textEl.textContent = goals[idx] ? goals[idx].text : '';
        return;
      }
      if (goals[idx] && newText !== goals[idx].text) {
        goals[idx].text = newText;
        storeSet(key, goals);
        reload();
      }
    });
  }

  // ----------- Drag reorder -----------
  function wireDragReorder(li, dragHandle, idx, key, reload) {
    li.draggable = false;
    dragHandle.addEventListener('mousedown', () => { li.draggable = true; });
    dragHandle.addEventListener('mouseup', () => { li.draggable = false; });
    li.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', String(idx));
      e.dataTransfer.effectAllowed = 'move';
      li.style.opacity = '0.4';
    });
    li.addEventListener('dragend', () => {
      li.style.opacity = '';
      li.draggable = false;
    });
    li.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      li.classList.add('is-dragover');
    });
    li.addEventListener('dragleave', () => {
      li.classList.remove('is-dragover');
    });
    li.addEventListener('drop', (e) => {
      e.preventDefault();
      li.classList.remove('is-dragover');
      const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
      const to = idx;
      if (isNaN(from) || from === to) return;
      const goals = storeGet(key) || [];
      const [moved] = goals.splice(from, 1);
      goals.splice(to, 0, moved);
      storeSet(key, goals);
      reload();
    });
  }

  // ----------- Build a goal row -----------
  function buildGoalRow(goal, idx, key, reload, readOnly) {
    const li = document.createElement('li');
    li.className = 'goal-item';
    if (goal.done) li.classList.add('is-done');
    if (goal.queued) li.classList.add('is-queued');

    const drag = document.createElement('span');
    drag.className = 'goal-drag';
    drag.textContent = '⋮⋮';
    drag.title = 'Drag to reorder';
    li.appendChild(drag);

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'goal-checkbox';
    cb.checked = !!goal.done;
    if (readOnly) {
      cb.disabled = true;
      cb.title = 'Activates at 6 AM tomorrow';
    }
    cb.addEventListener('change', () => {
      const goals = storeGet(key) || [];
      if (!goals[idx]) return;
      goals[idx].done = cb.checked;
      if (cb.checked) goals[idx].doneAt = Date.now();
      else delete goals[idx].doneAt;
      storeSet(key, goals);
      reload();
    });
    li.appendChild(cb);

    const text = document.createElement('div');
    text.className = 'goal-text';
    text.textContent = goal.text;
    li.appendChild(text);
    makeInlineEdit(text, () => storeGet(key) || [], idx, key, reload);

    const queueBtn = document.createElement('button');
    queueBtn.className = 'gm-queue-btn';
    queueBtn.type = 'button';
    queueBtn.textContent = '⚡';
    queueBtn.title = 'Queue for productivity window';
    if (goal.queued) queueBtn.classList.add('is-active');
    if (readOnly) queueBtn.disabled = true;
    queueBtn.addEventListener('click', () => {
      if (readOnly) return;
      const goals = storeGet(key) || [];
      if (!goals[idx]) return;
      goals[idx].queued = !goals[idx].queued;
      storeSet(key, goals);
      li.classList.add('is-queue-flashing');
      setTimeout(() => { reload(); }, 480);
    });
    li.appendChild(queueBtn);

    const del = document.createElement('button');
    del.className = 'goal-delete';
    del.type = 'button';
    del.textContent = '×';
    del.title = 'Delete';
    del.addEventListener('click', () => {
      const goals = storeGet(key) || [];
      goals.splice(idx, 1);
      storeSet(key, goals);
      reload();
    });
    li.appendChild(del);

    wireDragReorder(li, drag, idx, key, reload);

    return li;
  }

  // ----------- Today header / streak -----------
  function renderTodayHeader() {
    const key = 'goals:' + getActiveDateString();
    const goals = storeGet(key) || [];
    const total = goals.length;
    const done = goals.filter(g => g.done).length;

    gmProgressNum.textContent = String(done);
    gmProgressTotal.textContent = '/ ' + total;
    if (total === 0) gmProgressLabel.textContent = 'no goals yet';
    else if (done === total) gmProgressLabel.textContent = 'all done — solid day';
    else gmProgressLabel.textContent = 'complete';

    // segmented bar
    gmBar.innerHTML = '';
    for (let i = 0; i < total; i++) {
      const seg = document.createElement('div');
      seg.className = 'gm-bar-seg' + (goals[i].done ? ' gm-bar-seg-done' : '');
      gmBar.appendChild(seg);
    }

    if (total > 0 && done === total) gmCardToday.classList.add('gm-all-done');
    else gmCardToday.classList.remove('gm-all-done');

    const undone = goals.filter(g => !g.done).length;
    gmPushBtn.style.display = undone > 0 ? 'block' : 'none';

    todayLabel.textContent = 'Today — ' + formatDate(getActiveDateString());
  }

  function renderStreak() {
    const state = storeGet(STREAK_KEY) || { count: 0 };
    gmStreakNum.textContent = String(state.count || 0);
    if (state.count > 0) gmStreak.classList.add('gm-streak-active');
    else gmStreak.classList.remove('gm-streak-active');
  }

  function renderTomorrowCount() {
    const key = 'goals:' + getTomorrowDateString();
    const goals = storeGet(key) || [];
    gmTomorrowCount.textContent = goals.length + ' planned';
    tomorrowLabel.textContent = 'Plan tomorrow — ' + formatDate(getTomorrowDateString());
  }

  // ----------- Render list with show-more -----------
  function renderListInto(goals, listEl, emptyEl, key, readOnly) {
    listEl.innerHTML = '';
    if (!goals || goals.length === 0) {
      emptyEl.style.display = 'block';
    } else {
      emptyEl.style.display = 'none';
      const reload = readOnly ? loadTomorrow : loadToday;
      const limit = 5;
      const visible = goals.length > limit ? limit : goals.length;
      for (let i = 0; i < visible; i++) {
        listEl.appendChild(buildGoalRow(goals[i], i, key, reload, readOnly));
      }
      if (goals.length > limit) {
        const expanded = listEl.dataset.expanded === '1';
        if (expanded) {
          for (let i = limit; i < goals.length; i++) {
            listEl.appendChild(buildGoalRow(goals[i], i, key, reload, readOnly));
          }
        }
        const toggle = document.createElement('button');
        toggle.className = 'gm-show-more';
        toggle.type = 'button';
        toggle.textContent = expanded
          ? 'Show less ▴'
          : ('Show ' + (goals.length - limit) + ' more ▾');
        toggle.addEventListener('click', () => {
          listEl.dataset.expanded = expanded ? '0' : '1';
          renderListInto(goals, listEl, emptyEl, key, readOnly);
        });
        listEl.appendChild(toggle);
      }
    }
    if (readOnly) renderTomorrowCount();
    else renderTodayHeader();
  }

  function loadToday() {
    const key = 'goals:' + getActiveDateString();
    const goals = storeGet(key) || [];
    renderListInto(goals, goalList, emptyState, key, false);
  }
  function loadTomorrow() {
    const key = 'goals:' + getTomorrowDateString();
    const goals = storeGet(key) || [];
    renderListInto(goals, tomorrowList, tomorrowEmpty, key, true);
  }

  // ----------- Push remaining -----------
  gmPushBtn.addEventListener('click', () => {
    if (!confirm('Move all unchecked goals to tomorrow?')) return;
    const todayKey = 'goals:' + getActiveDateString();
    const tomorrowKey = 'goals:' + getTomorrowDateString();
    const today = storeGet(todayKey) || [];
    const tomorrow = storeGet(tomorrowKey) || [];
    const tomorrowTexts = new Set(tomorrow.map(g => g.text));
    const remaining = today.filter(g => !g.done);
    for (const g of remaining) {
      if (!tomorrowTexts.has(g.text)) {
        tomorrow.push({ text: g.text, done: false });
        tomorrowTexts.add(g.text);
      }
    }
    const kept = today.filter(g => g.done);
    storeSet(todayKey, kept);
    storeSet(tomorrowKey, tomorrow);
    loadToday();
    loadTomorrow();
  });

  // ----------- Add + Polish handlers -----------
  function showStatus(el, msg, isError) {
    el.textContent = msg;
    el.classList.toggle('is-error', !!isError);
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.textContent = ''; el.classList.remove('is-error'); }, 3500);
  }

  function makeAddHandlers(input, addBtn, polishBtn, getKey, statusEl, reload) {
    function doAdd(text) {
      const t = text.trim();
      if (!t) return;
      const key = getKey();
      const goals = storeGet(key) || [];
      goals.push({ text: t, done: false });
      storeSet(key, goals);
      input.value = '';
      reload();
    }
    addBtn.addEventListener('click', () => doAdd(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doAdd(input.value); }
    });

    polishBtn.addEventListener('click', async () => {
      const raw = input.value.trim();
      if (!raw) return;
      if (!ANTHROPIC_API_KEY) {
        doAdd(raw);
        showStatus(statusEl, 'Polish needs an Anthropic API key — added as-typed.', false);
        return;
      }
      polishBtn.disabled = true;
      const originalText = polishBtn.textContent;
      polishBtn.textContent = '… polishing';
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': ANTHROPIC_API_KEY,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-5',
            max_tokens: 1000,
            messages: [{
              role: 'user',
              content: 'Clean up exactly ONE goal and return it as a one-element JSON array of strings. No preamble, no code fences, just the JSON array.\n\nGoal: ' + raw
            }]
          })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const txt = data && data.content && data.content[0] && data.content[0].text;
        if (!txt) throw new Error('no text');
        const arr = JSON.parse(txt);
        if (!Array.isArray(arr) || !arr.length || typeof arr[0] !== 'string') throw new Error('bad shape');
        const key = getKey();
        const goals = storeGet(key) || [];
        goals.push({ text: arr[0].trim(), done: false });
        storeSet(key, goals);
        input.value = '';
        reload();
      } catch (err) {
        doAdd(raw);
        showStatus(statusEl, 'Polish failed — added as-typed.', true);
      } finally {
        polishBtn.disabled = false;
        polishBtn.textContent = originalText;
      }
    });
  }

  makeAddHandlers(goalInput, goalAddBtn, goalPolishBtn,
    () => 'goals:' + getActiveDateString(), polishStatus, loadToday);
  makeAddHandlers(tomorrowInput, tomorrowAddBtn, tomorrowPolishBtn,
    () => 'goals:' + getTomorrowDateString(), tomorrowStatus, loadTomorrow);

  // ============ TICKER ============
  const tickerStage = $('goalTickerStage');
  const tickerMeta = $('goalTickerMeta');
  let cycleIdx = 0;
  let tickerInterval = null;
  let firstRender = true;

  function buildTickerItems() {
    const key = 'goals:' + getActiveDateString();
    const goals = storeGet(key) || [];
    const total = goals.length;
    const done = goals.filter(g => g.done).length;
    let items;
    if (total === 0) {
      items = [{ status: 'empty', text: 'No goals set for today — add one to get rolling.' }];
    } else if (done === total) {
      items = [{ status: 'done', text: '✓ All goals done — solid day.' }];
    } else {
      items = goals.filter(g => !g.done).map(g => ({ status: 'pending', text: g.text }));
    }
    return { items, done, total };
  }

  function makeTickerRowEl(item) {
    const row = document.createElement('div');
    row.className = 'goal-ticker-row';
    const st = document.createElement('span');
    st.className = 'goal-ticker-status';
    st.setAttribute('data-status', item.status || '');
    if (item.status === 'done') st.textContent = '✓';
    else if (item.status === 'pending') st.textContent = '○';
    else st.textContent = '·';
    const tx = document.createElement('span');
    tx.className = 'goal-ticker-text';
    tx.textContent = item.text;
    row.appendChild(st);
    row.appendChild(tx);
    return row;
  }

  function tick() {
    const { items, done, total } = buildTickerItems();
    if (cycleIdx >= items.length) cycleIdx = 0;
    const item = items[cycleIdx];

    const existing = tickerStage.querySelector('.goal-ticker-row');
    const fresh = makeTickerRowEl(item);

    if (firstRender || !existing) {
      tickerStage.innerHTML = '';
      tickerStage.appendChild(fresh);
      firstRender = false;
    } else {
      existing.classList.add('is-leaving');
      setTimeout(() => { if (existing.parentNode) existing.parentNode.removeChild(existing); }, 460);
      fresh.classList.add('is-entering');
      tickerStage.appendChild(fresh);
    }

    tickerMeta.textContent = done + '/' + total;
    cycleIdx = (cycleIdx + 1) % items.length;
  }

  function startTicker() {
    tick();
    tickerInterval = setInterval(tick, 5000);
  }

  window.addEventListener('goals-changed', () => {
    cycleIdx = 0;
    tick();
  });

  // ============ DAY RING ============
  const WAKE_HOUR = 8;
  const SLEEP_HOUR = 24;
  const RING_R = 52;
  const RING_C = 2 * Math.PI * RING_R;

  const dayRingFill = $('dayRingFill');
  const dayRingPercent = $('dayRingPercent');
  const dayRingPhase = $('dayRingPhase');
  const dayRingClock = $('dayRingClock');
  const dayRingStatus = $('dayRingStatus');
  const dayRingRemaining = $('dayRingRemaining');

  dayRingFill.setAttribute('stroke-dasharray', String(RING_C));
  dayRingFill.setAttribute('stroke-dashoffset', String(RING_C));

  const SUN_STOPS = [
    [0,    [255, 216, 158]],
    [12.5, [255, 205, 121]],
    [25,   [255, 227, 143]],
    [37.5, [255, 183, 106]],
    [50,   [255, 149,  89]],
    [62.5, [243, 111,  79]],
    [75,   [226,  93, 122]],
    [87.5, [123,  91, 176]],
    [100,  [ 47,  58, 102]]
  ];
  function interpColor(percent) {
    if (percent <= 0) return SUN_STOPS[0][1];
    if (percent >= 100) return SUN_STOPS[SUN_STOPS.length-1][1];
    for (let i = 0; i < SUN_STOPS.length - 1; i++) {
      const [p1, c1] = SUN_STOPS[i];
      const [p2, c2] = SUN_STOPS[i+1];
      if (percent >= p1 && percent <= p2) {
        const t = (percent - p1) / (p2 - p1);
        return [
          Math.round(c1[0] + (c2[0]-c1[0])*t),
          Math.round(c1[1] + (c2[1]-c1[1])*t),
          Math.round(c1[2] + (c2[2]-c1[2])*t)
        ];
      }
    }
    return SUN_STOPS[0][1];
  }
  function rgb(arr) { return 'rgb(' + arr[0] + ',' + arr[1] + ',' + arr[2] + ')'; }

  function formatClock(now) {
    let h = now.getHours();
    const m = now.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + pad2(m) + ' ' + ampm;
  }

  function updateDayBar() {
    const now = new Date();
    const hours = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
    dayRingClock.textContent = formatClock(now);

    if (hours < WAKE_HOUR) {
      dayRingFill.setAttribute('stroke-dashoffset', String(RING_C));
      dayRingFill.style.stroke = '#4D4B47';
      dayRingPercent.textContent = '—';
      dayRingPhase.textContent = 'SLEEPING';
      dayRingStatus.textContent = '😴 Still sleeping';
      const remaining = WAKE_HOUR - hours;
      const rh = Math.floor(remaining);
      const rm = Math.floor((remaining - rh) * 60);
      dayRingRemaining.textContent = rh + 'h ' + rm + 'm until wake-up';
      return;
    }

    if (hours >= SLEEP_HOUR) {
      dayRingFill.setAttribute('stroke-dashoffset', '0');
      dayRingFill.style.stroke = '#E25D7A';
      dayRingPercent.textContent = '100%';
      dayRingPhase.textContent = 'PAST BEDTIME';
      dayRingStatus.textContent = '⚠️ Past bedtime';
      dayRingRemaining.textContent = 'Sleep!';
      return;
    }

    const percent = (hours - WAKE_HOUR) / (SLEEP_HOUR - WAKE_HOUR) * 100;
    const offset = RING_C * (1 - percent/100);
    dayRingFill.setAttribute('stroke-dashoffset', String(offset));
    dayRingFill.style.stroke = rgb(interpColor(percent));
    dayRingPercent.textContent = Math.floor(percent) + '%';

    let phase, status;
    if (percent < 25)      { phase = 'MORNING';   status = '☀️ Morning — fresh start'; }
    else if (percent < 50) { phase = 'MIDDAY';    status = '⚡ Midday — keep moving'; }
    else if (percent < 75) { phase = 'AFTERNOON'; status = '🔥 Afternoon — push it'; }
    else if (percent < 90) { phase = 'EVENING';   status = '⏳ Evening — wrap up'; }
    else                   { phase = 'BEDTIME';   status = '🌙 Bedtime soon'; }
    dayRingPhase.textContent = phase;
    dayRingStatus.textContent = status;

    const remaining = SLEEP_HOUR - hours;
    const rh = Math.floor(remaining);
    const rm = Math.floor((remaining - rh) * 60);
    dayRingRemaining.textContent = rh + 'h ' + rm + 'm awake time left';
  }

  // ============ INIT ============
  rolloverIncomplete();
  checkStreak();
  loadToday();
  loadTomorrow();
  renderStreak();
  updateDayBar();
  setInterval(updateDayBar, 60 * 1000);
  startTicker();

})();
</script>
